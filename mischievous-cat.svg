<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="100%" stop-color="#1a1b2e"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Tail (swishing) -->
  <path d="M 300 300 Q 360 280 355 220 Q 350 170 310 160"
        fill="none" stroke="#ff9f5a" stroke-width="18" stroke-linecap="round">
    <animate attributeName="d"
      values="M 300 300 Q 360 280 355 220 Q 350 170 310 160;
              M 300 300 Q 370 260 360 200 Q 345 150 300 150;
              M 300 300 Q 360 280 355 220 Q 350 170 310 160"
      dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- Body -->
  <ellipse cx="200" cy="290" rx="95" ry="70" fill="#ff9f5a"/>

  <!-- Head -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -4; 0 0" dur="2.2s" repeatCount="indefinite"/>

    <!-- Ears -->
    <path d="M 130 150 L 110 90 L 165 130 Z" fill="#ff9f5a"/>
    <path d="M 270 150 L 290 90 L 235 130 Z" fill="#ff9f5a"/>
    <path d="M 133 140 L 120 105 L 155 128 Z" fill="#ffcfa3"/>
    <path d="M 267 140 L 280 105 L 245 128 Z" fill="#ffcfa3"/>

    <!-- Face -->
    <circle cx="200" cy="200" r="90" fill="#ffb26b"/>

    <!-- Cheeks -->
    <circle cx="145" cy="220" r="16" fill="#ff7a7a" opacity="0.5"/>
    <circle cx="255" cy="220" r="16" fill="#ff7a7a" opacity="0.5"/>

    <!-- Eyes: one winking (mischief!), one open and gleaming -->
    <g>
      <!-- Left eye - open, sly gleam -->
      <ellipse cx="165" cy="190" rx="16" ry="20" fill="#1a1b2e"/>
      <circle cx="170" cy="182" r="5" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 2 0; 0 0; -2 0; 0 0" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <!-- Right eye - winking -->
      <path d="M 218 190 Q 235 182 252 190" fill="none" stroke="#1a1b2e" stroke-width="6" stroke-linecap="round">
        <animate attributeName="d"
          values="M 218 190 Q 235 182 252 190;
                   M 218 190 Q 235 182 252 190;
                   M 218 178 Q 235 168 252 178;
                   M 218 190 Q 235 182 252 190"
          dur="3s" keyTimes="0;0.6;0.7;1" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Nose -->
    <path d="M 195 215 L 205 215 L 200 222 Z" fill="#d1495b"/>

    <!-- Sly grin -->
    <path d="M 175 230 Q 200 250 230 226" fill="none" stroke="#7a3b1e" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d"
        values="M 175 230 Q 200 250 230 226;
                 M 175 230 Q 200 256 230 222;
                 M 175 230 Q 200 250 230 226"
        dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- Whiskers -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="110" y1="205" x2="60" y2="195"/>
      <line x1="110" y1="218" x2="58" y2="220"/>
      <line x1="290" y1="205" x2="340" y2="195"/>
      <line x1="290" y1="218" x2="342" y2="220"/>
    </g>
  </g>

  <!-- Front paws (one lifted mid-mischief, like about to knock something over) -->
  <ellipse cx="165" cy="345" rx="22" ry="18" fill="#ffb26b"/>
  <g>
    <ellipse cx="245" cy="335" rx="22" ry="18" fill="#ffb26b"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0 245 335; -15 245 335; 0 245 335"
      dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- Little "paw swipe" sparkle to sell the mischief -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.55;0.65;0.8" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 280 300 l 6 -14 l 6 14 l 14 6 l -14 6 l -6 14 l -6 -14 l -14 -6 z" fill="#ffe66d"/>
  </g>
</svg>
